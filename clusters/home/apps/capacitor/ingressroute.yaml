---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: capacitor-ingressroute
  namespace: flux-system  
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`capacitor.home.ffudo.me`)
      kind: Rule
      services:
        - name: capacitor
          port: 9000
  tls:
    secretName: capacitor-certificate-secret
