---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nginx-certificate  # <-- Replace with your certificate name
  namespace: nginx # <-- Replace with your namespace
spec:
  secretName: nginx-certificate-secret  # <-- Replace with your secret name
  issuerRef:
    name: cloudlfare-clusterissuer  # <-- Replace with your issuer name
    kind: ClusterIssuer
  dnsNames:
    - nginx.home.ffudo.me  # <-- Replace with your hostname
