---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kubernetes-dashboard
  namespace: flux-system
spec:
  interval: 10m0s
  url: https://kubernetes.github.io/dashboard/
---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: kubernetes-dashboard
  namespace: flux-system
spec:
  targetNamespace: kubernetes-dashboard
  storageNamespace: flux-system
  interval: 10m0s
  install:
    createNamespace: true
  chart:
    spec:
      chart: kubernetes-dashboard
      version: ">=7.12.0"
      sourceRef:
        kind: HelmRepository
        name: kubernetes-dashboard
        namespace: flux-system
  values:
    app:
      ingress:
        enabled: true
        hosts:
          - dashboard.home.ffudo.me
        ingressClassName: traefik-traefik
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.tls: "true"
          traefik.ingress.kubernetes.io/service.serversscheme: https
          traefik.ingress.kubernetes.io/service.serverstransport: dashboard-transport@kubernetescrd
      
      # Use the dashboard's built-in certificate generation
      certManager:
        enabled: false
      
      # Set this to false and let the dashboard handle its own certs
      tls:
        enabled: true
        secretName: null
        