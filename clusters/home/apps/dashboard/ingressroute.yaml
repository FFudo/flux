---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kubernetes-dashboard-ingressroute
  namespace: kubernetes-dashboard  
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`dashboard.home.ffudo.me`)
      kind: Rule
      services:
        - name: kubernetes-dashboard-kubernetes-dashboard-kong-proxy
          port: 443
  tls:
    secretName: kubernetes-dashboard-certificate-secret
