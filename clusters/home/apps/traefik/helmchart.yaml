---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 10m0s
  url: https://traefik.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: traefik
  namespace: flux-system
spec:
  targetNamespace: traefik
  storageNamespace: flux-system
  interval: 5m0s
  install:
    createNamespace: true
  chart:
    spec:
      chart: traefik
      version: "35.0.1"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  values:
    ports:
      web:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
            permanent: true
    ingressRoute:
      dashboard:
        enabled: true
        entryPoints: [web, websecure]
        matchRule: Host(`traefik-dashboard.home.ffudo.me`)
    service:
      spec:
        loadBalancerIP: "10.0.0.53"
