---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: name
  namespace: flux-system
spec:
  interval: 10m0s
  url: https://kubernetes.github.io/dashboard/
---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: name
  namespace: flux-system
spec:
  targetNamespace: name
  storageNamespace: flux-system
  interval: 10m0s
  install:
    createNamespace: true
  chart:
    spec:
      chart: name
      version: "0.0.0" # right version of helm chart
      sourceRef:
        kind: HelmRepository
        name: name
        namespace: flux-system
  values:
  